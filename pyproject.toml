[project]
name = "mrp"
version = "0.1.0"
description = "Sekai o Tsumugu Hime (织界之姬): a multi-character roleplay studio with branching stories and world building"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "deepseek-harness-sdk==0.1.5rc1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=45.0",
    "pydantic>=2.12,<3",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "regex>=2024.11",
    "httpx>=0.27",
    "sqlite-vec>=0.1.6",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mrp-server = "mrp.server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrp"]

[tool.pytest.ini_options]
testpaths = ["src/mrp/tests"]
asyncio_mode = "auto"
